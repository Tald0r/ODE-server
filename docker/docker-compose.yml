# Builds the DarkEden servers from the sources in this repository and runs them
# next to a MySQL 5.7 instance. Nothing is pulled from an image registry except
# the MySQL and Ubuntu base images.
#
#   cd docker
#   docker compose up -d --build

services:

  odk-mysql:
    image: mysql/mysql-server:5.7
    container_name: odk-mysql
    volumes:
      # Mounted file-by-file: mounting the whole initdb/ directory and then a
      # second file inside it makes docker create that file in the host repo.
      - ../initdb/DARKEDEN.sql:/docker-entrypoint-initdb.d/1-DARKEDEN.sql:ro
      - ../initdb/USERINFO.sql:/docker-entrypoint-initdb.d/2-USERINFO.sql:ro
      - ../initdb/a-setup.sql:/docker-entrypoint-initdb.d/3-a-setup.sql:ro
      # Runs last and points the server tables at this stack.
      - ./initdb-docker.sql:/docker-entrypoint-initdb.d/4-docker-setup.sql:ro
      - odk-mysql-data:/var/lib/mysql
    environment:
        MYSQL_ROOT_PASSWORD: 123456
    restart: on-failure
    command: mysqld --sql_mode="ONLY_FULL_GROUP_BY,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION" --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # The entrypoint only listens on TCP once the initdb scripts are done,
      # so this also tells us the DARKEDEN/USERINFO dumps have been imported.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uelcastle", "-pelca110"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - odk-network

  odk-server:
    # Built from source via ../Dockerfile (the same toolchain the README
    # describes, run inside docker) instead of pulling a pre-built image.
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Override in the environment for a Debug build.
        BUILD_TYPE: ${BUILD_TYPE:-Release}
    image: darkeden:local
    container_name: odk-server
    # Allow the 30s gameserver shutdown deadline plus supervisor overhead.
    stop_grace_period: 45s
    environment:
      # Opt in only while diagnosing packet/quest flow; off in production.
      DARKEDEN_TRACE: ${DARKEDEN_TRACE:-0}
      DARKEDEN_DB_CONNECT_TIMEOUT_SECONDS: ${DARKEDEN_DB_CONNECT_TIMEOUT_SECONDS:-5}
      DARKEDEN_DB_IO_TIMEOUT_SECONDS: ${DARKEDEN_DB_IO_TIMEOUT_SECONDS:-300}
    depends_on:
      odk-mysql:
        condition: service_healthy
    ports:
      - "9999:9999"
      - "9998:9998"
      - "9997:9997"
      - "9997:9997/udp"
      # The WebSocket gateway below shares this container's network namespace,
      # so its port is published here. Loopback only: browsers reach it through
      # a TLS-terminating reverse proxy in production (docs/websocket.md).
      - "127.0.0.1:8080:8080"
    # Start loginserver, sharedserver and gameserver in order. Override with
    # `command: ["sleep","infinity"]` to start them by hand inside the container.
    command: ["./start.sh"]
    # Mount config/data from the working tree to change them without a rebuild:
    # volumes:
    #   - ./conf/:/home/darkeden/vs/conf/
    #   - ../data/:/home/darkeden/vs/data/
    networks:
      - odk-network

  odk-websocket:
    # The Rust WebSocket gateway for browser and native WebSocket clients. It
    # must run in the game servers' network namespace: it forwards each
    # connection, with the client's address in a PROXY line, to the loopback
    # GatewayProxyPort listeners that conf/loginserver.conf (19099) and
    # conf/gameserver.conf (19098) open. websocket.json maps the advertised
    # 127.0.0.1:9999 and 127.0.0.1:9998 endpoints to those listeners and
    # admits pages served from http://127.0.0.1:18739 or localhost:18739.
    build:
      context: ../src/server/websocketproxyserver
    image: darkeden-websocket:local
    container_name: odk-websocket
    network_mode: "service:odk-server"
    depends_on:
      - odk-server
    volumes:
      - ./websocket.json:/config/config.json:ro
    restart: unless-stopped

volumes:
  odk-mysql-data:

networks:
  odk-network:
